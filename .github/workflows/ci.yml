name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 构建与测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # agent 跑在用户自己的机器上，跨平台都要能编出来
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # ★ gofmt 与 vet 是「能不能被合并」的前置条件，不是建议。
      #
      # ★★ 刻意**不写任何 shell 逻辑**（第一版写了 `out=$(gofmt -l .)` +
      #   `if [ -n "$out" ]` + `shell: bash`，在 Windows 上仍然红）。
      #
      #   两次失败各暴露一个跨平台陷阱：
      #     ① Windows runner 默认 shell 是 **PowerShell**，POSIX 语法直接报错；
      #        加 `shell: bash` 之后能跑，但——
      #     ② `set -euo pipefail` + 中文 `::error::` 输出在 Git Bash 的
      #        代码页下会出问题（Windows 默认 GBK，中文与 `::` 标记易被截断/乱码，
      #        而 Actions 对乱码输出的解析并不宽容）。
      #
      #   ⇒ 解法：**把判断交给一个仓库脚本**，yml 里只调它。
      #     `gofmt -d .` 单独用**不行** —— 它只打印 diff、退出码恒为 0，
      #     有未格式化文件时 step照样绿（这个坑我自己踩过一次）。
      #     所以判断逻辑放在 scripts/check-fmt.sh 里：
      #     既能本地实跑验证，又是纯 bash 3 可写、不依赖 runner 默认 shell。
      #
      #   ★ 教训：**CI 里跨平台的 step，越少逻辑越好**——
      #     逻辑该写在仓库脚本里（可本地验证），而不是散在 yml 里。
      - name: 格式检查
        shell: bash
        run: bash scripts/check-fmt.sh

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -race

      - name: 构建
        run: go build -o tunnel-agent .

  cross-compile:
    name: 交叉编译（${{ matrix.target }}）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # ★ 这一条是本仓库最实际的门禁：用户是把二进制**下载到别的机器上**跑的，
      #   所以"在 Ubuntu 上编出来的能不能在 Windows 上跑"是核心问题，
      #   而不是"能不能在本机跑起来"。
      - name: 交叉编译
        # ★ 这个 job 只在 ubuntu 上跑，但显式声明 bash 仍然是好习惯：
        #   将来有人把它加进三平台矩阵时不会突然踩 PowerShell 的坑。
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in \
            darwin/arm64 darwin/amd64 \
            linux/amd64 linux/arm64 \
            windows/amd64 windows/arm64
          do
            os="${target%%/*}"
            arch="${target##*/}"
            out="dist/tunnel-agent-${os}-${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            echo "▶ $os/$arch"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$out" .
            ls -lh "$out"
          done

      # ★ 与 release.yml 共用同一个校验脚本（不内联第二份）——
      #   CI 先拦住问题，就不必等发布流程才发现。
      - name: 校验产物架构
        run: bash scripts/verify-artifacts.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-agent-binaries
          path: dist/
          retention-days: 30