<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tunnel-agent 控制台</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <style>
    :root { font-family: system-ui, sans-serif; font-size: 14px; color: #16181d; background: #f5f6f8; }
    body { max-width: 1100px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .hint { color: #4a5160; margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-top: 12px; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font-family: ui-monospace, monospace; }
    textarea { min-height: 72px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
    button { padding: 8px 16px; cursor: pointer; }
    button.primary { background: #0b5bd3; color: #fff; border: none; border-radius: 4px; }
    button.danger { background: #c0261a; color: #fff; border: none; border-radius: 4px; }
    button.ghost { background: #fff; border: 1px solid #c5cad3; border-radius: 4px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log { background: #16181d; color: #e8eaed; padding: 12px; height: 320px; overflow: auto; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; margin-top: 8px; border-radius: 4px; }
    .summary { font-weight: 600; margin: 8px 0 16px; }
    .summary .on { color: #15803d; }
    .layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; margin-top: 20px; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
    .panel { background: #fff; border: 1px solid #dfe3ea; border-radius: 6px; padding: 12px; }
    .panel h2 { font-size: 1rem; margin: 0 0 8px; }
    #tunnelList { list-style: none; margin: 0; padding: 0; }
    #tunnelList li { border: 1px solid #e5e8ee; border-radius: 4px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
    #tunnelList li.selected { border-color: #0b5bd3; background: #eef4ff; }
    #tunnelList .meta { font-family: ui-monospace, monospace; font-size: 12px; color: #4a5160; }
    #tunnelList .actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    #tunnelList .actions button { padding: 4px 10px; font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .badge.on { background: #dcfce7; color: #166534; }
    .badge.off { background: #eef0f3; color: #4a5160; }
    .empty { color: #616875; padding: 12px 0; }
    .title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .title-row h1 { margin: 0; }
    .ver-badge {
      font-size: 12px; font-weight: 500; color: #616875;
      background: #eef0f3; border-radius: 999px; padding: 2px 10px;
      font-family: ui-monospace, monospace;
    }
    .footer-banner {
      margin-top: 24px; padding-top: 12px; border-top: 1px solid #dfe3ea;
      color: #4a5160; font-size: 12px; font-family: ui-monospace, monospace;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="title-row">
    <h1>tunnel-agent 控制台</h1>
    <span class="ver-badge" id="verBadge" title="构建时间未知">版本未知</span>
  </div>
  <p class="hint">可同时管理多条隧道。关闭本页<strong>不会</strong>退出程序，请从系统托盘选择「退出」。托盘「停止全部」会停掉所有隧道。</p>
  <p class="summary" id="summary">运行中 <span class="on" id="sumRunning">0</span> / 共 <span id="sumTotal">0</span></p>

  <div class="panel">
    <h2>新建隧道</h2>
    <label for="paste">粘贴整行命令</label>
    <textarea id="paste" placeholder="tunnel-agent -server wss://… -token … -local 127.0.0.1:3000 [-proto tcp]"></textarea>

    <label for="server">-server</label>
    <input id="server" type="text" autocomplete="off" />

    <label for="token">-token</label>
    <input id="token" type="password" autocomplete="off" />

    <label for="local">-local</label>
    <input id="local" type="text" value="127.0.0.1:3000" autocomplete="off" />

    <label for="proto">-proto（协议）</label>
    <select id="proto">
      <option value="http">http（默认，转发网页/接口）</option>
      <option value="tcp">tcp（任意 TCP：MySQL / SSH / RDP…）</option>
      <option value="udp">udp</option>
    </select>

    <label><input type="checkbox" id="verbose" /> 详细日志（-v）</label>

    <div class="row">
      <button type="button" class="primary" id="add">添加并启动</button>
      <button type="button" class="ghost" id="parse">从粘贴解析到表单</button>
      <button type="button" class="danger" id="stopAll">停止全部</button>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <h2>隧道列表</h2>
      <ul id="tunnelList"><li class="empty">暂无隧道</li></ul>
    </div>
    <div class="panel">
      <h2>选中隧道日志 <span id="selectedLabel" class="meta"></span></h2>
      <div class="row">
        <button type="button" id="copyLog">复制日志</button>
        <button type="button" id="clearLog">清空</button>
      </div>
      <div id="log" aria-live="polite"></div>
    </div>
  </div>

  <p class="footer-banner" id="footerBanner">版本未知</p>
  <script>
    const logEl = document.getElementById('log');
    const listEl = document.getElementById('tunnelList');
    let selectedId = null;
    let es = null;

    function closeLogStream() {
      if (es) {
        es.close();
        es = null;
      }
    }

    function appendLog(line) {
      logEl.textContent += (logEl.textContent ? '\n' : '') + line;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function openLogStream(id) {
      // ★ 切换选中隧道必须关掉旧 EventSource 再建新的，否则两条日志会串。
      closeLogStream();
      logEl.textContent = '';
      selectedId = id;
      document.getElementById('selectedLabel').textContent = id ? ('· ' + id) : '';
      if (!id) return;
      es = new EventSource('/api/tunnels/' + encodeURIComponent(id) + '/logs');
      es.onmessage = (ev) => appendLog(ev.data);
      es.onerror = () => { /* 浏览器会自动重连 */ };
    }

    async function refreshSummary() {
      const r = await fetch('/api/summary');
      const j = await r.json();
      document.getElementById('sumRunning').textContent = String(j.running ?? 0);
      document.getElementById('sumTotal').textContent = String(j.total ?? 0);
    }

    function renderList(items) {
      if (!items || items.length === 0) {
        listEl.innerHTML = '<li class="empty">暂无隧道</li>';
        if (selectedId) openLogStream(null);
        return;
      }
      listEl.innerHTML = '';
      let stillSelected = false;
      for (const t of items) {
        if (t.id === selectedId) stillSelected = true;
        const li = document.createElement('li');
        if (t.id === selectedId) li.classList.add('selected');
        const badge = t.running
          ? '<span class="badge on">运行中</span>'
          : '<span class="badge off">已停止</span>';
        li.innerHTML =
          '<div><strong>' + escapeHtml(t.local) + '</strong> · ' + escapeHtml(t.proto || 'http') + ' ' + badge + '</div>' +
          '<div class="meta">id=' + escapeHtml(t.id) + ' token=' + escapeHtml(t.token || '') + '</div>' +
          (t.error ? '<div class="meta">error=' + escapeHtml(t.error) + '</div>' : '') +
          '<div class="actions">' +
            '<button type="button" data-act="start" data-id="' + escapeHtml(t.id) + '">启动</button>' +
            '<button type="button" data-act="stop" data-id="' + escapeHtml(t.id) + '">停止</button>' +
            '<button type="button" class="danger" data-act="del" data-id="' + escapeHtml(t.id) + '">删除</button>' +
          '</div>';
        li.addEventListener('click', (ev) => {
          if (ev.target.closest('button')) return;
          document.querySelectorAll('#tunnelList li').forEach((n) => n.classList.remove('selected'));
          li.classList.add('selected');
          openLogStream(t.id);
        });
        listEl.appendChild(li);
      }
      if (!stillSelected && items.length) {
        openLogStream(items[0].id);
        listEl.querySelector('li')?.classList.add('selected');
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    async function refreshList() {
      const r = await fetch('/api/tunnels');
      const items = await r.json();
      renderList(Array.isArray(items) ? items : []);
      await refreshSummary();
    }

    listEl.addEventListener('click', async (ev) => {
      const btn = ev.target.closest('button[data-act]');
      if (!btn) return;
      ev.stopPropagation();
      const id = btn.getAttribute('data-id');
      const act = btn.getAttribute('data-act');
      if (act === 'start') {
        await fetch('/api/tunnels/' + encodeURIComponent(id) + '/start', { method: 'POST' });
      } else if (act === 'stop') {
        await fetch('/api/tunnels/' + encodeURIComponent(id) + '/stop', { method: 'POST' });
      } else if (act === 'del') {
        await fetch('/api/tunnels/' + encodeURIComponent(id), { method: 'DELETE' });
        if (selectedId === id) openLogStream(null);
      }
      await refreshList();
    });

    document.getElementById('add').onclick = async () => {
      const body = {
        server: document.getElementById('server').value,
        token: document.getElementById('token').value,
        local: document.getElementById('local').value,
        proto: document.getElementById('proto').value,
        verbose: document.getElementById('verbose').checked,
        paste: document.getElementById('paste').value.trim() ? document.getElementById('paste').value : '',
        start: true
      };
      const r = await fetch('/api/tunnels', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const j = await r.json();
      if (!j.ok) { alert(j.error || '添加失败'); return; }
      selectedId = j.id;
      await refreshList();
      openLogStream(j.id);
    };

    document.getElementById('stopAll').onclick = async () => {
      await fetch('/api/stop-all', { method: 'POST' });
      await refreshList();
    };

    document.getElementById('parse').onclick = async () => {
      const paste = document.getElementById('paste').value.trim();
      if (!paste) return;
      const r = await fetch('/api/parse', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ paste })
      });
      const j = await r.json();
      if (!j.ok) { alert(j.error || '解析失败'); return; }
      document.getElementById('server').value = j.server || '';
      document.getElementById('token').value = j.token || '';
      document.getElementById('local').value = j.local || '127.0.0.1:3000';
      document.getElementById('proto').value = j.proto || 'http';
      document.getElementById('verbose').checked = !!j.verbose;
    };

    document.getElementById('copyLog').onclick = async () => {
      if (!selectedId) return;
      const r = await fetch('/api/tunnels/' + encodeURIComponent(selectedId) + '/logs/snapshot');
      const j = await r.json();
      await navigator.clipboard.writeText(j.text || '');
    };

    document.getElementById('clearLog').onclick = async () => {
      if (!selectedId) return;
      await fetch('/api/tunnels/' + encodeURIComponent(selectedId) + '/logs/clear', { method: 'POST' });
      logEl.textContent = '';
    };

    async function loadVersion() {
      const badge = document.getElementById('verBadge');
      const foot = document.getElementById('footerBanner');
      try {
        const r = await fetch('/api/status');
        const j = await r.json();
        const ver = j.version ? String(j.version) : '';
        const bt = j.buildTime ? String(j.buildTime) : 'unknown';
        const banner = j.banner ? String(j.banner) : '';
        if (ver) {
          badge.textContent = 'v' + ver;
          badge.title = '构建于 ' + bt;
          if (foot) foot.textContent = banner || ('tunnel-agent ' + ver);
        } else {
          badge.textContent = '版本未知';
          badge.title = '构建时间未知';
        }
        foot.textContent = banner || '版本未知';
      } catch (_) {
        badge.textContent = '版本未知';
        badge.title = '构建时间未知';
        if (foot) foot.textContent = '版本未知';
      }
    }

    loadVersion();
    refreshList();
    setInterval(refreshList, 2000);
  </script>
</body>
</html>
