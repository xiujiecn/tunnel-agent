name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 构建与测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # agent 跑在用户自己的机器上，跨平台都要能编出来
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # ★ gofmt 与 vet 是"能不能被合并"的前置条件，不是建议。
      #
      #   ★★ 刻意用 `shell: bash` 而不是默认 shell：
      #   Windows runner 的默认是 PowerShell，而 `out=$(gofmt -l .)` +
      #   `if [ -n "$out" ]` 是POSIX 语法 —— 在 PowerShell 下直接报语法错，
      #   于是 job 挂在**格式检查**上，而与代码是否真的格式化过无关。
      #   （真实踩过：首次 push 的 run 里 ubuntu/macos 都过，只有 Windows 红了。）
      #   ⇒ 这类"用shell 语法写逻辑"的步骤必须显式声明 shell，
      #     或者干脆不要 shell。
      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::这些文件未格式化："
            echo "$out"
            echo "--- diff ---"
            gofmt -d .
            exit 1
          fi
          echo "gofmt 干净"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -race

      - name: 构建
        run: go build -o tunnel-agent .

  cross-compile:
    name: 交叉编译（${{ matrix.target }}）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # ★ 这一条是本仓库最实际的门禁：用户是把二进制**下载到别的机器上**跑的，
      #   所以"在 Ubuntu 上编出来的能不能在 Windows 上跑"是核心问题，
      #   而不是"能不能在本机跑起来"。
      - name: 交叉编译
        # ★ 这个 job 只在 ubuntu 上跑，但显式声明 bash 仍然是好习惯：
        #   将来有人把它加进三平台矩阵时不会突然踩 PowerShell 的坑。
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in \
            darwin/arm64 darwin/amd64 \
            linux/amd64 linux/arm64 \
            windows/amd64 windows/arm64
          do
            os="${target%%/*}"
            arch="${target##*/}"
            out="dist/tunnel-agent-${os}-${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            echo "▶ $os/$arch"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$out" .
            ls -lh "$out"
          done

      # ★ 与 release.yml 共用同一个校验脚本（不内联第二份）——
      #   CI 先拦住问题，就不必等发布流程才发现。
      - name: 校验产物架构
        run: bash scripts/verify-artifacts.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-agent-binaries
          path: dist/
          retention-days: 30