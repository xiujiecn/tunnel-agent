name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 构建与测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # agent 跑在用户自己的机器上，跨平台都要能编出来
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # ★ 跟随 go.mod，避免版本漂移
          cache: true

      # ★ gofmt 与 vet 是「能不能被合并」的前置条件，不是建议。
      #
      # ★★ 刻意**不写任何 shell 逻辑**（第一版写了 `out=$(gofmt -l .)` +
      #   `if [ -n "$out" ]` + `shell: bash`，在 Windows 上仍然红）。
      #
      #   两次失败各暴露一个跨平台陷阱：
      #     ① Windows runner 默认 shell 是 **PowerShell**，POSIX 语法直接报错；
      #        加 `shell: bash` 之后能跑，但——
      #     ② `set -euo pipefail` + 中文 `::error::` 输出在 Git Bash 的
      #        代码页下会出问题（Windows 默认 GBK，中文与 `::` 标记易被截断/乱码，
      #        而 Actions 对乱码输出的解析并不宽容）。
      #
      #   ⇒ 解法：**把判断交给一个仓库脚本**，yml 里只调它。
      #     `gofmt -d .` 单独用**不行** —— 它只打印 diff、退出码恒为 0，
      #     有未格式化文件时 step照样绿（这个坑我自己踩过一次）。
      #     所以判断逻辑放在 scripts/check-fmt.sh 里：
      #     既能本地实跑验证，又是纯 bash 3 可写、不依赖 runner 默认 shell。
      #
      #   ★ 教训：**CI 里跨平台的 step，越少逻辑越好**——
      #     逻辑该写在仓库脚本里（可本地验证），而不是散在 yml 里。
      - name: 格式检查
        shell: bash
        run: bash scripts/check-fmt.sh

      - name: go vet
        run: go vet ./...

      # ★ 诊断：macOS 的 cgo 报错常常只有一行 "exit status 1"，看不出原因。
      #   把编译器版本、关键 go env、以及单独编 gui 包的结果都打出来。
      - name: 诊断（编译器与 cgo）
        shell: bash
        run: |
          set -uo pipefail
          echo "== runner =="; uname -a
          echo "== go =="; go version; go env GOOS GOARCH CGO_ENABLED CC CXX
          echo "== cc =="; (cc --version 2>&1 | head -3) || echo "cc 缺失"
          echo "== clang =="; (clang --version 2>&1 | head -3) || echo "clang 缺失"
          echo "== 单独编译 gui 包（cgo 隔离验证）=="
          CGO_ENABLED=1 go build -x ./gui/ 2>&1 | tail -40 || echo "gui 包编译失败（见上）"

      # ★ 竞态检测只在非 macOS 上跑：
      #   gui 包在 darwin 下是 cgo（ObjC/Cocoa），而 -race 要注入自己的运行时，
      #   两者在 mac 上组合容易在链接阶段失败；同一份代码已在 ubuntu 用 -race 覆盖，
      #   mac 上再跑一次收益很低，却会掩盖真正的错误信息。
      - name: go test
        shell: bash
        run: |
          set -uo pipefail
          FLAGS="-count=1 -v -timeout=120s"
          [ "${{ runner.os }}" = "macOS" ] || FLAGS="$FLAGS -race"
          # ★ 逐包跑：任何一个包挂掉时，能立刻看出是哪一个，
          #   而不是只得到一句 "FAIL github.com/... [build failed]"。
          FAILED=0
          for pkg in . ./agent ./gui ./lib; do
            echo "════════ go test $pkg ════════"
            if ! go test $FLAGS "$pkg" 2>&1; then
              echo "::error::包 $pkg 测试失败（上面是该包完整输出）"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "---- 失败时 dump 环境，便于定位 ----"
            go version; go env GOOS GOARCH CGO_ENABLED
            uname -a
            exit 1
          fi
          echo "全部包测试通过"

      - name: 构建
        run: go build -o tunnel-agent .

  cross-compile:
    name: 交叉编译 linux/windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # ★ 跟随 go.mod，避免版本漂移
          cache: true

      # ★ 这一条是本仓库最实际的门禁：用户是把二进制**下载到别的机器上**跑的，
      #   所以"在 Ubuntu 上编出来的能不能在 Windows 上跑"是核心问题，
      #   而不是"能不能在本机跑起来"。
      - name: 交叉编译并打包
        # ★ 这个 job 只在 ubuntu 上跑，但显式声明 bash 仍然是好习惯：
        #   将来有人把它加进三平台矩阵时不会突然踩 PowerShell 的坑。
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          DIST="$(pwd)/dist"
          # ★ macOS 已从这里移除：状态栏托盘是 cgo（Cocoa），
          #   CGO_ENABLED=0 时 darwin 的 gui 包缺 runTray/runHostWindow，
          #   构建会报 undefined —— 见下方 macos-app job。
          #
          # ★ 只出压缩包，不出裸二进制（与 release.yml 同一口径）：
          #   裸文件没有扩展名，浏览器当未知类型、Gatekeeper 直接拦，
          #   下载页也从不下发它。
          for target in \
            linux/amd64 linux/arm64 \
            windows/amd64 windows/arm64
          do
            os="${target%%/*}"
            arch="${target##*/}"
            work="$(mktemp -d)"
            echo "▶ $os/$arch"

            if [ "$os" = "windows" ]; then
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$work/tunnel-agent.exe" .
              (cd "$work" && zip -q "$DIST/tunnel-agent-${os}-${arch}.zip" tunnel-agent.exe)
            else
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$work/tunnel-agent" .
              chmod 755 "$work/tunnel-agent"
              tar -czf "dist/tunnel-agent-${os}-${arch}.tar.gz" -C "$work" tunnel-agent
            fi
            rm -rf "$work"
          done
          ls -lh dist/

      # ★ 与 release.yml 共用同一个校验脚本（不内联第二份）——
      #   CI 先拦住问题，就不必等发布流程才发现。
      - name: 校验产物架构
        run: bash scripts/verify-artifacts.sh dist unix

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-agent-binaries
          path: dist/
          retention-days: 30

  # ★ macOS 单独一个 job：托盘走 cgo（Cocoa），必须在真 mac 机器上编，
  #   且 CGO_ENABLED=1 —— 所以它不能挤进上面 ubuntu 的交叉编译循环。
  macos-app:
    name: 构建 macOS 产物（cgo）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # ★ 跟随 go.mod，避免版本漂移
          cache: true

      - name: 诊断（macOS 工具链）
        shell: bash
        run: |
          set -uo pipefail
          echo "== runner =="; uname -a
          echo "== go =="; go version; go env GOOS GOARCH CGO_ENABLED CC
          echo "== xcode =="; xcode-select -p || true
          echo "== 单独编译 gui 包（cgo 隔离验证）=="
          CGO_ENABLED=1 go build -v ./gui/ 2>&1 | tail -50 || echo "gui 编译失败（见上）"

      - name: 构建 macOS .app（CGO_ENABLED=1）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in arm64 amd64; do
            echo "▶ darwin/$arch"
            bash scripts/build-macos.sh "$arch" dist
          done
          ls -laR dist/

      - name: 校验 macOS 产物
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist/
          # ★ 只有压缩包，没有裸文件 —— 与 release.yml 同一口径
          for a in arm64 amd64; do
            test -f "dist/tunnel-agent-darwin-${a}.tar.gz" || { echo "::error::缺 .tar.gz ${a}"; exit 1; }
          done
          # 解开来看里面是不是真的 .app、二进制架构对不对
          bash scripts/verify-artifacts.sh dist macos
          echo "✓ macOS 产物齐全"

      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-agent-macos
          path: dist/*
          retention-days: 30
